name: Automated Build and Deployment Workflow

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Latest Code from GitHub
        uses: actions/checkout@v4

      - name: 2. Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: 3. Execute Automated Build and Tests
        run: mvn clean test # Run unit tests on the GitHub runner first

      - name: 4. Build Docker Artifact
        run: docker build -t ticket-app:latest .

      - name: 5. Execute Automated Deployment
        run: |
          docker stop ticket-app-container || true
          docker rm ticket-app-container || true
          docker run -d --name ticket-app-container -p 8080:8080 ticket-app:latest

      - name: 6. Verify Deployment Success
        run: |
          sleep 5
          curl -f http://localhost:8080/ || exit 1
name: Automated Build and Deployment Workflow

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Latest Code from GitHub
        uses: actions/checkout@v4

      - name: 2. Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: 3. Execute Automated Build and Tests
        run: mvn clean test

      - name: 4. Build Docker Artifact
        run: docker build -t ticket-app:latest .

      - name: 5. Execute Automated Deployment
        run: |
          docker rm -f ticket-app-container 2>/dev/null || true
          docker run -d --name ticket-app-container -p 8080:8080 ticket-app:latest

      - name: 6. Verify Deployment Success
        run: |
          for i in {1..30}; do
            if curl -fsS http://localhost:8080/version; then
              exit 0
            fi
            sleep 2
          done
          docker logs ticket-app-container
          exit 1